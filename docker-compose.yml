# LOCAL DEVELOPMENT ONLY.
#
# This stack deliberately uses plaintext PostgreSQL on the private Compose
# network, development AutoMigrate, testnet chain settings, and development
# secrets. It is not a production deployment topology. Payminto does not ship
# a production Compose topology until versioned migrations, database TLS, and
# backup/restore gates are complete (see docs/OPERATIONS.md).
name: payminto-development

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USERNAME:-payminto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-payminto-development-db}
      POSTGRES_DB: ${POSTGRES_DATABASE:-payminto}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DATABASE: ${POSTGRES_DATABASE:-payminto}
      POSTGRES_USERNAME: ${POSTGRES_USERNAME:-payminto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-payminto-development-db}
      POSTGRES_SSL_MODE: disable
      POSTGRES_SCHEMA_MODE: auto-migrate
      POSTGRES_ALLOW_INSECURE_LOCAL: "false"
      REDIS_URL: redis://redis:6379
      SERVER: DEVELOPMENT
      BLOCKCHAIN_NETWORK_TYPE: testnet
      API_PORT: 8080
      CHECKOUT_BASE_URL: ${CHECKOUT_BASE_URL:-http://localhost:3002}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:-payminto-development-jwt-secret-not-for-production}
      CUSTODY_ENABLED: ${CUSTODY_ENABLED:-true}
      VAULT_PASSPHRASE: ${VAULT_PASSPHRASE:-payminto-development-vault-passphrase-only}
      COLD_WALLET_ETH: ${COLD_WALLET_ETH:-}
      COLD_WALLET_BTC: ${COLD_WALLET_BTC:-}
      COLD_WALLET_TRX: ${COLD_WALLET_TRX:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api/v1}
        NEXT_PUBLIC_CHECKOUT_URL: ${CHECKOUT_BASE_URL:-http://localhost:3002}
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api/v1}
    depends_on:
      - backend

  checkout:
    build: ./checkout
    ports:
      - "3002:3002"
    environment:
      PAYMINTO_API_URL: http://backend:8080/api/v1
    depends_on:
      - backend

  mcp-server:
    build: ./mcp-server
    ports:
      - "3333:3333"
    environment:
      PAYMINTO_API_URL: http://backend:8080/api/v1
      PAYMINTO_API_KEY: ${MCP_API_KEY:-development-only-api-key}
    depends_on:
      - backend

  # Optional local TLS reverse proxy. It is excluded from the default stack
  # because it requires developer-provided certificates under certbot_data.
  # Start explicitly with: docker compose --profile local-tls up
  nginx:
    profiles: ["local-tls"]
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_data:/etc/letsencrypt:ro
    depends_on:
      - backend
      - frontend
      - mcp-server

volumes:
  postgres_data:
  certbot_data:
