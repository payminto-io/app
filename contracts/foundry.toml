[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
# The fixture test writes real-forwarder logs for the Go reader test (backend/internal/cre/chainlink).
fs_permissions = [{ access = "read-write", path = "./test/cre/fixtures" }]

[profile.default.fuzz]
runs = 256

[fmt]
line_length = 120
# Vendored Chainlink sources keep upstream formatting so a diff against the pinned commit stays clean.
ignore = ["test/cre/vendor/**"]
