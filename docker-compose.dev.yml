# LOCAL DEVELOPMENT ONLY. This second development stack intentionally uses
# testnet, plaintext PostgreSQL on the private Compose network, and AutoMigrate.
# It runs the built backend image; it does not provide source hot reload.
name: payminto-development-backend

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: payminto
      POSTGRES_PASSWORD: payminto_dev
      POSTGRES_DB: payminto_test
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payminto"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      # Test money only: a test process refuses a remote database not named *_test (ticket 13).
      GATEWAY_ENVIRONMENT: test
      # Attestations (docs/cre/SPEC.md): off by default; set CRE_ENABLED=true CRE_PROVIDER=mock with --profile cre.
      # Tokens must be at least 32 characters (openssl rand -hex 32).
      CRE_ENABLED: ${CRE_ENABLED:-false}
      CRE_PROVIDER: ${CRE_PROVIDER:-none}
      CRE_PUBLIC_BASE_URL: ${CRE_PUBLIC_BASE_URL:-http://backend:8080}
      CRE_READ_TOKEN_SOLVENCY: ${CRE_READ_TOKEN_SOLVENCY:-}
      CRE_READ_TOKEN_DEPOSIT_FINALITY: ${CRE_READ_TOKEN_DEPOSIT_FINALITY:-}
      CRE_READ_TOKEN_CONVERSION_REFERENCE: ${CRE_READ_TOKEN_CONVERSION_REFERENCE:-}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DATABASE: payminto_test
      POSTGRES_USERNAME: payminto
      POSTGRES_PASSWORD: payminto_dev
      POSTGRES_SSL_MODE: disable
      POSTGRES_SCHEMA_MODE: auto-migrate
      POSTGRES_ALLOW_INSECURE_LOCAL: "false"
      REDIS_URL: redis://redis:6379
      SERVER: DEVELOPMENT
      BLOCKCHAIN_NETWORK_TYPE: testnet
      API_PORT: 8080
      JWT_SECRET: payminto-development-jwt-secret-not-for-production
      # No proxy in this stack: clients reach the backend directly, so no X-Forwarded-For is trusted.
      # Put a proxy in front and this must name it (docs/OPERATIONS.md, Client IPs).
      TRUSTED_PROXIES: ""
      CUSTODY_ENABLED: "true"
      VAULT_PASSPHRASE: payminto-development-vault-passphrase-only
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  # Attestation simulator: the real CRE workflows run locally with `cre workflow simulate` against
  # the backend (mock provider). Excluded from the default stack.
  # Start with: CRE_ENABLED=true CRE_PROVIDER=mock docker compose --profile cre up
  cre-simulator:
    profiles: ["cre"]
    build: ./docker/cre-simulator
    environment:
      CRE_PUBLIC_BASE_URL: http://backend:8080
      CRE_SIMULATE_INTERVAL: ${CRE_SIMULATE_INTERVAL:-300}
      CRE_READ_TOKEN_SOLVENCY: ${CRE_READ_TOKEN_SOLVENCY:-}
      CRE_READ_TOKEN_DEPOSIT_FINALITY: ${CRE_READ_TOKEN_DEPOSIT_FINALITY:-}
      CRE_READ_TOKEN_CONVERSION_REFERENCE: ${CRE_READ_TOKEN_CONVERSION_REFERENCE:-}
    volumes:
      - ./cre:/workspace/cre:ro
    depends_on:
      - backend

volumes:
  postgres_data:
