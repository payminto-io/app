name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.5.0
          working-directory: backend
      - name: Vet
        working-directory: backend
        run: go vet ./...
      - name: Unit and package tests
        working-directory: backend
        run: go test -race -coverprofile=coverage.out ./...
      - name: PostgreSQL integration gate
        working-directory: backend
        run: |
          set -o pipefail
          docker info
          go test -tags=integration ./internal/database ./internal/paymentlifecycle/postgres -count=1 -json | tee integration-test.json
          if grep -q '"Action":"skip"' integration-test.json; then
            echo "A required PostgreSQL integration test skipped; CI requires every migration and lifecycle contract test to execute"
            exit 1
          fi
      - name: Tempo ledger PostgreSQL regression gate
        working-directory: backend
        run: |
          set -o pipefail
          go test -race -tags=integration ./internal/service -run '^TestTempoPostgres' -count=1 -json | tee tempo-integration-test.json
          if grep -q '"Action":"skip"' tempo-integration-test.json; then
            echo "Tempo ledger regression tests must execute against disposable PostgreSQL"
            exit 1
          fi
      - name: Build binary
        working-directory: backend
        run: go build ./cmd/server/
      - name: Build backend image
        working-directory: backend
        run: docker build --tag payminto-backend:ci .

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Test
        working-directory: frontend
        run: npm test
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Build application
        working-directory: frontend
        run: npm run build
      - name: Build frontend image
        working-directory: frontend
        run: docker build --tag payminto-frontend:ci .

  checkout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: checkout/package-lock.json
      - name: Install
        working-directory: checkout
        run: npm ci
      - name: Typecheck
        working-directory: checkout
        run: npx tsc --noEmit
      - name: Test
        working-directory: checkout
        run: npm test
      - name: Lint
        working-directory: checkout
        run: npm run lint
      - name: Build application
        working-directory: checkout
        run: npm run build

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Test
        working-directory: contracts
        run: forge test -vvv
