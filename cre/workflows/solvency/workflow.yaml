# Targets match cre/project.yaml. The workflow-name per target is what GatewayAttestations binds through
# WorkflowName.keystone(name) (CRE_WORKFLOW_NAME_SOLVENCY for the deploy script); keep them in sync.
local-simulation:
  user-workflow:
    workflow-name: "solvency-local-simulation"
    deployment-registry: "private"
  workflow-artifacts:
    workflow-path: "./main.ts"
    config-path: "./config.local-simulation.json"
    secrets-path: "../../secrets.yaml"

staging:
  user-workflow:
    workflow-name: "solvency-staging"
    deployment-registry: "private"
  workflow-artifacts:
    workflow-path: "./main.ts"
    config-path: "./config.staging.json"
    secrets-path: "../../secrets.yaml"

production:
  user-workflow:
    workflow-name: "solvency-production"
    deployment-registry: "private"
  workflow-artifacts:
    workflow-path: "./main.ts"
    config-path: "./config.production.json"
    secrets-path: "../../secrets.yaml"
